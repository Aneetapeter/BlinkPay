name: blinkpay
description: A new Flutter project for BlinkPay splash and login.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^2.7.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4 
  permission_handler: ^11.0.0
  local_auth: ^2.1.6
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  path_provider: ^2.1.2
  reorderables: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/bank.json
    - assets/animations/logo.json
    - assets/images/blink_logo.png